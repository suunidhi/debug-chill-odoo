<!DOCTYPE html>
<html>
<head>
  <title>StackIt Q&A Forum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to StackIt Q&A Forum</h1>
  <p id="welcomeText">👋 Hello, user!</p>
  <p><a href="login.html" onclick="logout()">Logout</a></p>

  <a href="add_question.html">+ Ask a Question</a>
  <h2>All Questions</h2>

  <div id="questionsContainer"></div>

  <script>
    // ✅ Check login
    const username = localStorage.getItem("username");
    const token = localStorage.getItem("token");

    if (!username || !token) {
      alert("Please login first!");
      window.location.href = "login.html";
    } else {
      document.getElementById("welcomeText").innerText = `👋 Hello, ${username}!`;
    }

    // ✅ Logout
    function logout() {
      localStorage.removeItem("username");
      localStorage.removeItem("token");
    }

    // ✅ Fetch and render questions
    fetch("http://127.0.0.1:5000/api/questions")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("questionsContainer");
        if (data.length === 0) {
          container.innerHTML = "<p>No questions posted yet.</p>";
        } else {
          data.forEach(row => {
            const div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `
              <h3><a href="view_question.html?id=${row.id}">${row.title}</a></h3>
              <p>${row.description.slice(0, 150)}...</p>
              <small>Posted on ${row.created_at}</small>
            `;
            container.appendChild(div);
          });
        }
      })
      .catch(err => {
        document.getElementById("questionsContainer").innerHTML =
          "<p style='color: red;'>❌ Failed to load questions.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
