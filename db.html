<!DOCTYPE html>
<html>
<head>
  <title>StackIt Questions</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>📋 All Questions</h1>
  <div id="questionsContainer"></div>

  <script>
    fetch("http://127.0.0.1:5000/api/questions")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("questionsContainer");
        data.forEach(q => {
          const div = document.createElement("div");
          div.classList.add("question");
          div.innerHTML = `
            <h3><a href="view_question.html?id=${q.id}">${q.title}</a></h3>
            <p>${q.description.substring(0, 150)}...</p>
            <small>Posted on ${q.created_at}</small>
          `;
          container.appendChild(div);
        });
      });
  </script>
</body>
</html>
